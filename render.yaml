services:
  - type: web
    name: city-mall-smart-locker
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: .next-build
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://city-mall-smart-locker-api.onrender.com/api
      - key: NEXT_PUBLIC_SOCKET_URL
        value: https://city-mall-smart-locker-api.onrender.com

  - type: web
    name: city-mall-smart-locker-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run prisma:generate && npm run build
    startCommand: npm run start:deploy
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://meek-creponne-66cec9.netlify.app,https://city-mall-smart-locker.netlify.app,https://city-mall-smart-locker.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: city-mall-smart-locker-db
          property: connectionString
      - key: ADMIN_PIN
        value: "2026"
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: PAYMENT_MODE
        value: MOCK
      - key: SMS_MODE
        value: DEVSMS
      - key: SMS_PROVIDER
        value: DEVSMS
      - key: SMS_ALLOW_LOCAL_SEND
        value: "false"
      - key: ESKIZ_SENDER
        value: "4546"
      - key: DEVSMS_BASE_URL
        value: https://devsms.uz/api
      - key: DEVSMS_TOKEN
        sync: false
      - key: DEVSMS_SENDER
        value: "4546"
      - key: DEVSMS_TYPE
        value: universal_otp
      - key: DEVSMS_TEMPLATE_TYPE
        value: "1"
      - key: DEVSMS_SERVICE_NAME
        value: City Mall
      - key: SMS_AUTH_MESSAGE
        value: "Tashkent City Mall tasdiqlash kodi: {code}"
      - key: HARDWARE_MODE
        value: MOCK
      - key: ONE_C_MODE
        value: FILE
      - key: GOOGLE_SHEETS_MODE
        value: ENABLED
      - key: GOOGLE_SHEETS_SPREADSHEET_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_EMAIL
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY
        sync: false
      - key: GOOGLE_SHEETS_PAYMENTS_SHEET
        value: Payments
      - key: GOOGLE_SHEETS_TARIFFS_SHEET
        value: Tariffs
      - key: CCTV_MODE
        value: MANUAL
      - key: CCTV_RETENTION_DAYS
        value: "30"

databases:
  - name: city-mall-smart-locker-db
    plan: free
    databaseName: locker_system
    user: locker_user
